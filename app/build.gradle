plugins {
    id 'com.android.application'
}

android {
    namespace 'com.casper.tvmonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.casper.tvmonitor"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero 3rd party dependencies - ultra fast and reliable
}
